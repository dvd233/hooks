name: Validate pending retry cleanup

on:
  push:
    branches:
      - validation/retry-disable

permissions:
  contents: read

jobs:
  native:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'dvd233/hooks' &&
      github.repository_id == '1352925854' &&
      github.repository_owner_id == '111864431' &&
      github.ref == 'refs/heads/validation/retry-disable'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    env:
      CI: 'true'
      HUSKY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - name: Initialize artifact directory
        shell: bash
        run: |
          printf '%s\n' "AHOOKS_REPORT_DIR=$RUNNER_TEMP/ahooks-retry-node-${{ matrix.node }}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ahooks-retry-node-${{ matrix.node }}"
      - name: Checkout immutable validation controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dvd233/hooks
          ref: ${{ github.sha }}
          path: validation
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout unchanged upstream baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: alibaba/hooks
          ref: 43003f3bd5e6921173cfa2a791ed9d34e5221935
          path: baseline
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout immutable candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dvd233/hooks
          ref: 9543334bb37472dac56a86cfa4f14440d4743eac
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Install native Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned package manager
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.12.4
          run_install: false
      - name: Check validation oracles
        run: node validation/.github/ci/validate.mjs --self-test
      - name: Validate baseline and frozen source with native workspace commands
        run: node validation/.github/ci/validate.mjs
      - name: Upload bounded validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ahooks-retry-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AHOOKS_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 7
